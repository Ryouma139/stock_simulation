name: update prices & deploy

on:
  workflow_dispatch:
  # Cloudflare のシークレットを設定したら有効化（平日 18:00 JST）
  # schedule:
  #   - cron: "0 9 * * 1-5"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch monthly prices
        run: python scripts/fetch_prices.py 7203.T 6758.T ^N225 --years 20
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=stock-simulator
